name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS-arm64
            runs_on: macos-latest
            arch: arm64
            ext: ""
            compress: "tar.gz"
          - os: Windows-x86_64
            runs_on: windows-latest
            arch: x86_64
            ext: ".exe"
            compress: "zip"
          - os: Linux-x86_64
            runs_on: ubuntu-latest
            arch: x86_64
            ext: ""
            compress: "tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build with PyInstaller
        run: uv run python build.py

      - name: Make executable (non-Windows)
        if: matrix.os != 'Windows-x86_64'
        run: chmod +x dist/nga-search

      - name: Compress
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.compress }}" = "tar.gz" ]; then
            tar czf "nga-search-${{ matrix.os }}.tar.gz" nga-search
            echo "asset=dist/nga-search-${{ matrix.os }}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            zip "nga-search-${{ matrix.os }}.zip" nga-search.exe
            echo "asset=dist/nga-search-${{ matrix.os }}.zip" >> "$GITHUB_OUTPUT"
          fi
        id: compress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nga-search-${{ matrix.os }}
          path: ${{ steps.compress.outputs.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true