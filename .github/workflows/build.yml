name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS-arm64
            runs_on: macos-latest
            arch: arm64
            ext: ""
          - os: Windows-x86_64
            runs_on: windows-latest
            arch: x86_64
            ext: ".exe"
          - os: Linux-x86_64
            runs_on: ubuntu-latest
            arch: x86_64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build with PyInstaller
        run: uv run python build.py

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          echo "name=nga-search-${{ matrix.os }}" >> "$GITHUB_OUTPUT"
          echo "binary=dist/nga-search${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.binary }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            for f in "$dir"/*; do
              base=$(basename "$f")
              ext="${base##*.}"
              if [ "$ext" = "exe" ]; then
                cp "$f" "release/nga-search-${name}.exe"
              else
                cp "$f" "release/nga-search-${name}"
              fi
            done
          done
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true