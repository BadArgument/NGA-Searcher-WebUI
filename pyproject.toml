[project]
name = "nga-search"
version = "0.1.0"
description = "NGA 版面搜索器 - 全版面本地全文搜索工具（CLI + Web 双模）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyinstaller>=6.0"]

[project.scripts]
nga = "nga_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nga_search"]

[tool.hatch.build.targets.sdist]
include = ["web/"]